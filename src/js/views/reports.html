<div class="page-view">
    <div class="page-head">
        <div>
            <h1>Compliance reports</h1>
            <p>Backend-generated AML reports with immutable metadata.</p>
        </div>
        <div class="page-actions"><select class="screen-form-input report-investigation-select" data-bind="value: selectedInvestigationId, options: investigations, optionsText: 'id', optionsValue: 'id', optionsCaption: 'Workspace snapshot'"></select><oj-button chroming="callToAction" on-oj-action="[[generate]]" disabled="[[loading]]"><span data-bind="text: loading() ? 'Generating...' : '+ Generate report'"></span></oj-button></div>
    </div>
    <p class="error-message" data-bind="visible: error, text: error"></p><p class="loading-message" data-bind="visible: loading">Collecting cases and transactions...</p>
    <div class="panel table-panel"><div class="responsive-table"><table class="aegis-data-table"><thead><tr><th>Report</th><th>Type</th><th>Reference</th><th>Generated by</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody data-bind="foreach: rows"><tr><td data-label="Report" data-bind="text: id"></td><td data-label="Type" data-bind="text: type"></td><td data-label="Reference" data-bind="text: reference"></td><td data-label="Generated by" data-bind="text: owner"></td><td data-label="Date" data-bind="text: date"></td><td data-label="Status"><span class="status ready" data-bind="text: status"></span></td><td data-label="Action"><button class="report-download" data-bind="click: $parent.showReport">View</button><button class="report-download" data-bind="click: $parent.download">Download</button></td></tr></tbody></table><p class="empty-state" data-bind="visible: !loading() && !rows().length">No reports generated yet.</p></div></div>
    <div class="alert-scrim" data-bind="visible: selectedReport, click: closeReport"></div><aside class="investigation-report" data-bind="css: { 'is-open': selectedReport }, with: selectedReport" aria-label="Report preview"><button class="triage-close" data-bind="click: $parent.closeReport" aria-label="Close">&times;</button><span class="triage-eyebrow">Report preview</span><h2 data-bind="text: id"></h2><p data-bind="text: type + ' · ' + date"></p><pre class="report-preview" data-bind="text: content"></pre><div class="triage-actions"><button class="primary" data-bind="click: $parent.download">Download report</button></div></aside>
</div>
