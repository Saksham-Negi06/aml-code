<div class="page-view">
    <div class="page-head">
        <div>
            <h1>Compliance reports</h1>
            <p>Backend-generated AML reports with immutable metadata.</p>
        </div>
        <div class="page-actions"><oj-button chroming="callToAction" on-oj-action="[[generate]]">+ Generate
                report</oj-button></div>
    </div>
    <div class="panel table-panel"><table class="aegis-data-table"><thead><tr><th>Report</th><th>Type</th><th>Reference</th><th>Generated by</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody data-bind="foreach: rows"><tr><td data-bind="text: id"></td><td data-bind="text: type"></td><td data-bind="text: reference"></td><td data-bind="text: owner"></td><td data-bind="text: date"></td><td><span class="status ready" data-bind="text: status"></span></td><td><button class="report-download" data-bind="click: $parent.download">Download</button></td></tr></tbody></table></div>
</div>
