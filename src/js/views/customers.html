<div class="page-view">
  <div class="page-head">
    <div>
      <h1>Customers</h1>
      <p>Live customer records and risk levels from the AML backend.</p>
    </div>
  </div>
  <p class="error-message" data-bind="visible: error, text: error"></p>
  <p class="loading-message" data-bind="visible: loading">Loading customer records…</p>
  <div class="panel table-panel">
    <div class="table-toolbar">
      <div class="search">
        <span aria-hidden="true">⌕</span
        ><input
          aria-label="Search customers"
          placeholder="Search by ID, holder type, KYC status..."
          data-bind="value: search, valueUpdate: 'input'"
        />
      </div>
      <span data-bind="text: filteredCustomers().length + ' customer(s)'"></span>
    </div>
    <div class="responsive-table">
    <table class="aegis-data-table">
      <thead>
        <tr>
          <th>Customer ID</th>
          <th>Holder type</th>
          <th>KYC status</th>
          <th>Risk</th>
          <th>Risk country</th>
          <th>Accounts</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody data-bind="foreach: filteredCustomers">
        <tr class="customer-row" data-bind="click: $parent.openCustomer">
          <td data-label="Customer" data-bind="text: id"></td>
          <td data-label="Holder type" data-bind="text: accountHolderType"></td>
          <td data-label="KYC" data-bind="text: kycVerificationStatus"></td>
          <td data-label="Risk"><span class="risk-pill" data-bind="text:riskLevel,css:riskLevel.toLowerCase()"></span></td>
          <td data-label="Risk country" data-bind="text: riskCountryFlag"></td>
          <td data-label="Accounts" data-bind="text: accountCount"></td>
          <td data-label="Created" data-bind="text: createdAt"></td>
        </tr>
      </tbody>
    </table>
    <p class="loading-message" data-bind="visible: !loading() && !filteredCustomers().length">No customers match your search.</p>
    </div>
  </div>
</div>
