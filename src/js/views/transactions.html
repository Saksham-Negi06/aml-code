<div class="page-view">
  <div class="page-head">
    <div>
      <h1>Transaction monitoring</h1>
    </div>
    <span data-bind="text:filtered().length+' transaction(s)'"></span>
  </div>
  <p class="loading-message" data-bind="visible:loading">
    Loading transactions and risk results…
  </p>
  <p class="error-message" data-bind="visible:error,text:error"></p>
  <div class="panel table-panel">
    <div class="responsive-table">
      <table class="aegis-data-table transaction-table">
        <thead>
          <tr>
            <th>Transaction</th>
            <th>Sender</th>
            <th>Receiver</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Risk</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody data-bind="foreach:filtered">
          <tr class="customer-row" data-bind="click:$parent.openTransaction">
            <td data-label="Transaction" data-bind="text:transactionId"></td>
            <td data-label="Sender" data-bind="text:senderAccountId"></td>
            <td data-label="Receiver" data-bind="text:receiverAccountId"></td>
            <td data-label="Date" data-bind="text:displayDate"></td>
            <td data-label="Amount" data-bind="text:displayAmount"></td>
            <td data-label="Type" data-bind="text:paymentType"></td>
            <td data-label="Risk">
              <span
                class="risk-pill"
                data-bind="text:riskCategory,css:riskCategory.toLowerCase()"
              ></span>
            </td>
            <td data-label="Status">
              <span
                class="status"
                data-bind="text:status,css:$parent.statusClass(status)"
              ></span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div
    class="alert-scrim"
    data-bind="visible:selectedTransaction,click:closeTransaction"
  ></div>
  <aside
    class="transaction-detail"
    data-bind="css:{'is-open':selectedTransaction},with:selectedTransaction"
  >
    <button class="triage-close" data-bind="click:$parent.closeTransaction">
      ×</button
    ><span class="triage-eyebrow">Transaction detail</span>
    <h2 data-bind="text:transactionId"></h2>
    <p data-bind="text:displayDate"></p>
    <div class="triage-stats">
      <div><small>Amount</small><b data-bind="text:displayAmount"></b></div>
      <div>
        <small>Risk</small
        ><b
          class="risk-pill"
          data-bind="text:riskCategory,css:riskCategory.toLowerCase()"
        ></b>
      </div>
      <div>
        <small>Status</small
        ><b
          class="status"
          data-bind="text:status,css:$parent.statusClass(status)"
        ></b>
      </div>
    </div>
    <h3>Payment details</h3>
    <div class="triage-context">
      <div><small>Sender</small><b data-bind="text:senderAccountId"></b></div>
      <div>
        <small>Receiver</small><b data-bind="text:receiverAccountId"></b>
      </div>
      <div>
        <small>Payment currency</small><b data-bind="text:paymentCurrency"></b>
      </div>
      <div>
        <small>Received currency</small
        ><b data-bind="text:receivedCurrency"></b>
      </div>
      <div><small>Payment type</small><b data-bind="text:paymentType"></b></div>
      <div>
        <small>Investigation</small
        ><b data-bind="text:caseRecord?caseRecord.id:'None'"></b>
      </div>
    </div>
    <h3>Risk explanation</h3>
    <div class="triage-reason"><p data-bind="text:explanation"></p></div>
    <h3>Recommendation</h3>
    <div class="recommendation" data-bind="text:recommendation"></div>
  </aside>
</div>
