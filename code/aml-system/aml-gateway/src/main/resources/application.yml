server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      # The transaction service also applies Spring Security CORS. Keep the
      # gateway's value and collapse the duplicate headers on routed responses.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:8000"
              - "http://127.0.0.1:8000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: transaction-service
          # Local development route. This avoids a 503 when Eureka is not
          # running or the transaction service has not registered yet.
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/accounts/**, /api/v1/customers/**, /api/v1/cases/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
